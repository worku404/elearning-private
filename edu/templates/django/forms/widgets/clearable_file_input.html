{# Global override: show current image preview instead of file path. #}

{% if widget.is_initial %}
  <div class="c-file-current">
    {% if widget.value %}
      {% firstof widget.value.url widget.value as current_url %}
      {% if current_url %}
        <img
          src="{{ current_url }}"
          alt="Current image"
          style="max-width: 140px; height: auto; border-radius: 12px; border: 1px solid var(--color-border);"
        >
      {% endif %}
    {% endif %}

    {% if not widget.required %}
      <div style="margin-top: 10px;">
        <label for="{{ widget.checkbox_id }}">
          <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}>
          Clear
        </label>
      </div>
    {% endif %}
  </div>
{% endif %}

<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
