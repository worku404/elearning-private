{% load static %}
<div class="assistant-resize-handle assistant-resize-handle--top" data-resize-edge="top" aria-hidden="true"></div>
<div class="assistant-resize-handle assistant-resize-handle--bottom" data-resize-edge="bottom" aria-hidden="true"></div>
<div class="assistant-resize-handle assistant-resize-handle--left" data-resize-edge="left" aria-hidden="true"></div>
<div class="assistant-resize-handle assistant-resize-handle--right" data-resize-edge="right" aria-hidden="true"></div>

<div class="assistance-toolbar">
    <div class="assistance-toolbar__left">
        <button
            class="assistant-history-toggle"
            type="button"
            aria-label="Toggle chat history"
            aria-expanded="false"
            data-assistant-history-toggle
        >
            <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
            >
                <line x1="4" y1="7" x2="20" y2="7"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="17" x2="20" y2="17"></line>
            </svg>
        </button>
        <span class="assistance-title">AI Assistant</span>
    </div>
    <div class="assistance-toolbar-actions">
        <button
            id="assistant-close-btn"
            class="assistance-close"
            type="button"
            aria-label="Close AI sidebar"
        >
            &times;
        </button>
    </div>
</div>

<div
    class="assistant-history-shell"
    data-assistant-history-shell
    data-chats-new-url="{% url 'assistant:llm_new_chat' %}"
    data-chats-detail-url-template="{% url 'assistant:llm_open_chat' 0 %}"
    data-chats-pin-url-template="{% url 'assistant:llm_toggle_pin' 0 %}"
>
    <aside
        class="assistant-history-sidebar"
        data-assistant-history-sidebar
        aria-hidden="true"
        aria-label="Chat history"
    >
        <div class="assistant-history-sidebar__header">
            <span class="assistant-history-sidebar__title">History</span>
        </div>
        <button
            class="assistant-history-new"
            type="button"
            data-assistant-new-chat
        >
            New chat
        </button>
        <div class="assistant-history-scroll">
            <section
                class="assistant-history-section"
                data-assistant-pinned-section
            >
                <div class="assistant-history-section__title">Pinned</div>
                <ul
                    class="assistant-history-list"
                    data-assistant-pinned-list
                ></ul>
                <p
                    class="assistant-history-empty"
                    data-assistant-pinned-empty
                    hidden
                >
                    No pinned chats yet.
                </p>
            </section>
            <section
                class="assistant-history-section"
                data-assistant-temp-section
            >
                <div class="assistant-history-section__title">
                    Current (temporary)
                </div>
                <ul
                    class="assistant-history-list"
                    data-assistant-temp-list
                ></ul>
                <p
                    class="assistant-history-empty"
                    data-assistant-temp-empty
                    hidden
                >
                    No temporary chat.
                </p>
            </section>
        </div>
        <p
            class="assistant-history-error"
            data-assistant-history-error
            hidden
        ></p>
    </aside>

    <div id="history-container" class="llm-history"></div>
</div>
{{ llm_history|json_script:"llm-history" }}
{{ llm_chat_state|json_script:"llm-chat-state" }}

<form id="llm-form" class="llm-form" autocomplete="off">
    <button
        id="llm-scroll-bottom"
        class="llm-scroll-bottom"
        type="button"
        aria-label="Scroll to latest message"
        title="Scroll to bottom"
        hidden
    >
        <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2.3"
            aria-hidden="true"
        >
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14" />
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M7.5 14.5L12 19l4.5-4.5"
            />
        </svg>
    </button>
    {% csrf_token %}
    <div class="llm-composer">
        <div class="llm-input">{{ llm_form.prompt }}</div>
        <div class="llm-controls">
            <button
                class="llm-btn llm-btn--send"
                type="submit"
                aria-label="Send message"
                title="Send message"
            >
                <span
                    class="llm-send-icon llm-send-icon--send"
                    aria-hidden="true"
                >
                    <svg
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <path
                            fill="currentColor"
                            d="M3.4 20.6 21 12 3.4 3.4l.9 7.2L14 12l-9.7 1.4.9 7.2Z"
                        />
                    </svg>
                </span>
                <span
                    class="llm-send-icon llm-send-icon--stop"
                    aria-hidden="true"
                >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <rect
                            x="7.2"
                            y="7.2"
                            width="9.6"
                            height="9.6"
                            rx="2.1"
                            fill="currentColor"
                        ></rect>
                    </svg>
                </span>
            </button>
        </div>
    </div>
</form>

<script src="{% static 'assistant/js/assistant.js' %}" defer></script>
