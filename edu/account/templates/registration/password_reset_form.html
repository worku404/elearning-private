{% extends "base.html" %} {% load static %} {% block title %}Reset Password{% endblock %} {% block extra_css %}
<link rel="stylesheet" href="{% static 'css/account-auth.css' %}" />
<link rel="stylesheet" href="{% static 'css/responsive/account-auth.css' %}" />
{% endblock %} {% block content %}
<section class="auth-page">
    <h1 class="auth-page__title">Forgot your password?</h1>
    <p class="auth-page__subtitle">
        Enter your account email and we will send a reset link.
    </p>

    <article class="auth-card">
        <form method="post" class="auth-form">
            {% csrf_token %} {{ form.as_p }}
            <button type="submit" class="auth-btn">Send Reset Link</button>
        </form>
    </article>
</section>
{% endblock %}
