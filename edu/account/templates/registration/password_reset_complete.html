{% extends "base.html" %}
{% load static %}
{% block title %}Password Reset Complete{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/account-auth.css' %}">
{% endblock %}

{% block content %}
<section class="auth-page">
    <h1 class="auth-page__title">Password reset complete</h1>
    <p class="auth-page__subtitle">You can now sign in using your new password.</p>

    <article class="auth-card">
        <div class="auth-links">
            <a href="{% url 'login' %}">Sign in</a>
        </div>
    </article>
</section>
{% endblock %}
