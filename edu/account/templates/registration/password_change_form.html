{% extends "base.html" %} {% load static %} {% block title %}Change Password{%
endblock %} {% block extra_css %}
<link rel="stylesheet" href="{% static 'css/account-auth.css' %}" />
<link rel="stylesheet" href="{% static 'css/responsive/account-auth.css' %}" />
{% endblock %} {% block content %}
<section class="auth-page">
    <h1 class="auth-page__title">Change your password</h1>
    <p class="auth-page__subtitle">
        Use a strong password with letters, numbers, and symbols.
    </p>

    <article class="auth-card">
        <form method="post" class="auth-form">
            {% csrf_token %} {{ form.as_p }}
            <button type="submit" class="auth-btn">Update Password</button>
        </form>
    </article>
</section>
{% endblock %}
